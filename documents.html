<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Documents</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-slate-200 flex flex-col items-center py-8 px-4 font-sans sm:py-12">

  <div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-6 sm:p-8 space-y-6 border border-white">

    <div id="dashboard-link-wrap" class="flex items-center justify-between">
      <a id="btn-dashboard" href="index.html" class="flex items-center text-slate-500 text-sm font-semibold hover:text-slate-700">
        <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i>
        Dashboard
      </a>
    </div>

    <div class="text-center space-y-2">
      <div class="w-16 h-16 mx-auto flex items-center justify-center mb-1 bg-white rounded-full shadow-sm border border-slate-100 ring-4 ring-white/50 overflow-hidden">
        <i data-lucide="folder-open" class="w-7 h-7 text-sky-500"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">My Documents</h1>
      <p class="text-slate-500 text-sm leading-relaxed px-2 font-medium">Files Zayb has made just for you. Tap one to open it.</p>
    </div>

    <div id="grid" class="flex flex-col gap-3"></div>
    <p id="empty" class="hidden text-center text-sm text-slate-400 font-medium">Nothing here yet.</p>

  </div>

  <script>
    lucide.createIcons();

    const FIRESTORE_PROJECT = 'accountability-app-68ab7';
    const code = new URLSearchParams(window.location.search).get('client');

    if (code) {
      document.getElementById('btn-dashboard').href = `index.html?client=${encodeURIComponent(code)}`;
    } else {
      document.getElementById('dashboard-link-wrap').style.display = 'none';
    }

    function formatDate(ms) {
      if (!ms) return '';
      return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function load() {
      const gridEl = document.getElementById('grid');
      const emptyEl = document.getElementById('empty');
      if (!code) { emptyEl.classList.remove('hidden'); return; }
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/dashboardAccess/${encodeURIComponent(code)}`);
        if (!res.ok) { emptyEl.classList.remove('hidden'); return; }
        const fields = (await res.json()).fields || {};
        if (!(fields.active && fields.active.booleanValue === true)) { emptyEl.classList.remove('hidden'); return; }
        const values = (fields.documents && fields.documents.arrayValue && fields.documents.arrayValue.values) || [];
        const docs = values.map(v => {
          const f = (v.mapValue && v.mapValue.fields) || {};
          return {
            title: f.title ? f.title.stringValue : 'Document',
            url: f.url ? f.url.stringValue : '#',
            addedAt: f.addedAt ? Number(f.addedAt.integerValue || f.addedAt.doubleValue || 0) : 0
          };
        }).sort((a, b) => b.addedAt - a.addedAt);

        if (docs.length === 0) { emptyEl.classList.remove('hidden'); return; }

        docs.forEach(item => {
          const a = document.createElement('a');
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'flex items-center p-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200';
          const icon = document.createElement('div');
          icon.className = 'w-10 h-10 rounded-xl bg-sky-50 flex items-center justify-center mr-3 flex-shrink-0';
          icon.innerHTML = '<i data-lucide="file-text" class="w-5 h-5 text-sky-500"></i>';
          const text = document.createElement('div');
          text.className = 'flex-1 min-w-0';
          const title = document.createElement('div');
          title.className = 'font-bold text-sm text-slate-800 truncate';
          title.textContent = item.title;
          const date = document.createElement('div');
          date.className = 'text-xs text-slate-400 mt-0.5';
          date.textContent = formatDate(item.addedAt);
          text.appendChild(title);
          text.appendChild(date);
          const arrow = document.createElement('i');
          arrow.setAttribute('data-lucide', 'download');
          arrow.className = 'w-4 h-4 text-slate-400 flex-shrink-0 ml-2';
          a.appendChild(icon);
          a.appendChild(text);
          a.appendChild(arrow);
          gridEl.appendChild(a);
        });
        lucide.createIcons();
      } catch (e) {
        emptyEl.classList.remove('hidden');
      }
    }

    load();
  </script>
</body>
</html>
