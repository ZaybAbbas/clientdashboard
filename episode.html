<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Episode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes bounceDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }
    .bounce-arrow { animation: bounceDown 1.2s ease-in-out infinite; }
    .bounce-arrow-delay { animation: bounceDown 1.2s ease-in-out infinite; animation-delay: 0.15s; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-slate-200 flex flex-col items-center py-10 px-4 font-sans">

  <div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-6 sm:p-8 space-y-6 border border-white">

    <div class="text-center space-y-3">
      <div class="w-16 h-16 mx-auto flex items-center justify-center bg-white rounded-full shadow-sm border border-slate-100 ring-4 ring-white/50 overflow-hidden">
        <img
          src="https://firebasestorage.googleapis.com/v0/b/accountability-566c2.firebasestorage.app/o/088529ce-52f4-4ef7-a65f-0923d5901386.png?alt=media"
          alt="Z.A Training"
          class="w-full h-full object-contain p-2"
        />
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">New episode is live!</h1>
      <p class="text-slate-500 text-sm font-medium">Hit play below to start listening.</p>
    </div>

    <div class="flex justify-center gap-6 text-red-600">
      <i data-lucide="arrow-big-down-dash" class="w-9 h-9 bounce-arrow" stroke-width="2.5"></i>
      <i data-lucide="arrow-big-down-dash" class="w-9 h-9 bounce-arrow-delay" stroke-width="2.5"></i>
    </div>

    <div class="rounded-2xl overflow-hidden border border-slate-100 shadow-sm">
      <iframe
        id="podcast-player"
        width="100%"
        height="180"
        frameborder="no"
        scrolling="no"
        src="https://share.transistor.fm/e/z-a-training-client-channel-408ffdb4-3173-456d-ba37-c54163041fae/playlist"
      ></iframe>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
